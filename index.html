<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>GrowWorld</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >


    <!-- =========================
         THREE.JS IMPORT MAP
    ========================== -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }
    </script>

</head>


<body>


    <!-- =========================
         3D GAME
    ========================== -->

    <div id="game"></div>


    <!-- =========================
         LOGIN
    ========================== -->

    <div id="login" class="login-screen">

        <div class="login-card">

            <h1>GrowWorld</h1>

            <p class="subtitle">
                Онлайн 3D-мир, где ты можешь расти
            </p>

            <input
                id="nameInput"
                type="text"
                maxlength="24"
                placeholder="Введите имя"
                autocomplete="off"
            >

            <button id="startButton">
                Войти в мир
            </button>

            <div id="loginStatus"></div>

        </div>

    </div>


    <!-- =========================
         GAME HUD
    ========================== -->

    <div
        id="hud"
        class="hidden"
    >

        <div class="top-bar">

            <div class="stats">

                <div class="stat">

                    <span>
                        Рост
                    </span>

                    <strong id="height">
                        1.00 м
                    </strong>

                </div>


                <div class="stat">

                    <span id="online">
                        Онлайн: 1
                    </span>

                </div>

            </div>


            <button id="growButton">
                +1 см
            </button>

        </div>


        <!-- =========================
             MINIMAP
        ========================== -->

        <div id="minimap">

            <canvas
                id="mapCanvas"
                width="180"
                height="180"
            ></canvas>

        </div>


        <!-- =========================
             CHAT
        ========================== -->

        <div id="chat">

            <div id="chatMessages"></div>


            <form id="chatForm">

                <input
                    id="chatInput"
                    type="text"
                    maxlength="300"
                    placeholder="Написать сообщение..."
                    autocomplete="off"
                >

                <button type="submit">
                    ➤
                </button>

            </form>

        </div>


        <!-- =========================
             CONTROLS
        ========================== -->

        <div id="controls">

            <span>
                WASD — движение
            </span>

            <span>
                Space — прыжок
            </span>

            <span>
                Колесо — приближение
            </span>

            <span>
                Мышь — камера
            </span>

        </div>

    </div>


    <!-- =========================
         THREE.JS
         GLTF / OBJ / MTL
    ========================== -->

    <script type="module">

        import * as THREE
            from "three";


        /*
         * GLTF
         */

        import { GLTFLoader }
            from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


        /*
         * OBJ
         */

        import { OBJLoader }
            from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/OBJLoader.js";


        /*
         * MTL
         */

        import { MTLLoader }
            from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/MTLLoader.js";


        /*
         * Делаем библиотеки
         * доступными для app.js.
         */

        window.THREE = THREE;

        window.GLTFLoader = GLTFLoader;

        window.OBJLoader = OBJLoader;

        window.MTLLoader = MTLLoader;


        /*
         * Проверка загрузки
         */

        console.log(
            "Three.js:",
            typeof window.THREE
        );

        console.log(
            "Three.js version:",
            THREE.REVISION
        );

        console.log(
            "GLTFLoader:",
            typeof window.GLTFLoader
        );

        console.log(
            "OBJLoader:",
            typeof window.OBJLoader
        );

        console.log(
            "MTLLoader:",
            typeof window.MTLLoader
        );


        /*
         * Загружаем app.js только после
         * загрузки всех библиотек.
         */

        const script =
            document.createElement("script");


        script.src =
            "/static/app.js";


        script.onload = () => {

            console.log(
                "GrowWorld app.js loaded"
            );

        };


        script.onerror = () => {

            console.error(
                "Не удалось загрузить /static/app.js"
            );

        };


        document.body.appendChild(
            script
        );

    </script>


</body>

</html>
