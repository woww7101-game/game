<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>GrowWorld</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <!-- 3D игра -->
    <div id="game"></div>

    <!-- Экран входа -->
    <div id="login" class="login-screen">

        <div class="login-card">

            <h1>GrowWorld</h1>

            <p class="subtitle">
                Онлайн 3D-мир, где ты можешь расти
            </p>

            <input
                id="nameInput"
                type="text"
                maxlength="24"
                placeholder="Введите имя"
                autocomplete="off"
            >

            <button id="startButton">
                Войти в мир
            </button>

            <div id="loginStatus"></div>

        </div>

    </div>

    <!-- Игровой HUD -->
    <div id="hud" class="hidden">

        <div class="top-bar">

            <div class="stats">

                <div class="stat">
                    <span>Рост</span>
                    <strong id="height">1.00 м</strong>
                </div>

                <div class="stat">
                    <span id="online">Онлайн: 1</span>
                </div>

            </div>

            <button id="growButton">
                +1 см
            </button>

        </div>

        <!-- Миникарта -->
        <div id="minimap">

            <canvas
                id="mapCanvas"
                width="180"
                height="180"
            ></canvas>

        </div>

        <!-- Чат -->
        <div id="chat">

            <div id="chatMessages"></div>

            <form id="chatForm">

                <input
                    id="chatInput"
                    type="text"
                    maxlength="300"
                    placeholder="Написать сообщение..."
                    autocomplete="off"
                >

                <button type="submit">
                    ➤
                </button>

            </form>

        </div>

        <!-- Управление -->
        <div id="controls">
            <span>WASD — движение</span>
            <span>Space — прыжок</span>
            <span>Колесо — приближение</span>
            <span>Мышь — камера</span>
        </div>

    </div>

    <!-- Three.js -->
    <script src="https://unpkg.com/three@0.180.0/build/three.min.js"></script>

    <!-- Проверка загрузки Three.js -->
    <script>
        console.log("Three.js:", typeof THREE);
    </script>

    <!-- GrowWorld -->
    <script src="/static/app.js"></script>

</body>
</html>
